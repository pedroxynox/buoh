name: desktop

# Prototipo de escritorio (ADR-0010): compila el instalador de Windows y corre las pruebas de Rust.
# Solo corre cuando cambia algo que entra en la app (apps/desktop, apps/web y sus paquetes) o la
# configuración de pnpm, Node o turbo, para no gastar minutos de Windows. También se lanza a mano.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/contracts/**'
      - 'packages/design-system/**'
      - 'packages/prototype-data/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - '.node-version'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/contracts/**'
      - 'packages/design-system/**'
      - 'packages/prototype-data/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - '.node-version'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: desktop:windows
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Versión tomada de packageManager en package.json (pnpm 12.14.0).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Versión tomada de .node-version (Node.js 24.22.0).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Versión tomada de apps/desktop/src-tauri/rust-toolchain.toml.
      - name: Instalar Rust
        working-directory: apps/desktop/src-tauri
        run: rustup toolchain install && rustc --version

      - run: pnpm install --frozen-lockfile --filter "@buoh/desktop..."

      # `generate_context!` incrusta apps/web/out al compilar, así que la web va primero.
      - run: pnpm exec turbo run build --filter=@buoh/web

      - name: Rust (formato, lint y pruebas)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Instalador NSIS
        run: pnpm --filter @buoh/desktop exec tauri build --ci -- --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buoh-escritorio-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
